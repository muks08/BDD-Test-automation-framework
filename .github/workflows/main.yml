name: Build and Test PROD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 5 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration PROD

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg2
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Allure Commandline
      run: |
        sudo apt-get install -y unzip
        wget -q https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip
        unzip allure-2.30.0.zip
        sudo mv allure-2.30.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration PROD

    - name: Run tests on PROD
      run: xvfb-run -a dotnet test --no-build --verbosity normal --configuration PROD
      continue-on-error: true

    - name: Create Allure Results dir
      run: mkdir -p /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/allure-results

    - name: Copy files - UI
      run: cp -r /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/Tests.UI/bin/PROD/net6.0/allure-results/* /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/allure-results

    - name: Copy files - API
      run: cp -r /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/Tests.API/bin/PROD/net6.0/allure-results/* /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/allure-results

    - name: Generate Allure Report
      run: allure generate --single-file /home/runner/work/BDD-Test-automation-framework/BDD-Test-automation-framework/allure-results -o allure-report

    - name: Upload Allure Report
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: allure-report/index.html
