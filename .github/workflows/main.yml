name: Build and Test PROD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Install ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        export CHROME_DRIVER_PATH=$(which chromedriver)

    - name: Run ChromeDriver
      run: |
        ${CHROME_DRIVER_PATH} --allowed-ips=0.0.0.0 &

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration PROD

    - name: Run tests on PROD
      run: dotnet test --no-build --verbosity normal --configuration PROD
